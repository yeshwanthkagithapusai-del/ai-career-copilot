services:
  - type: web
    name: ai-career-copilot
    runtime: python
    region: singapore
    plan: free
    rootDir: project/career_copilot
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn career_copilot.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECRET_KEY
        generateValue: true
