{% extends 'base.html' %}
{% block title %}Password Reset Sent{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block body %}
<div class="login-container">
    <div class="login-card animate-scale-in text-center">
        <i class="fas fa-envelope-open-text" style="font-size: 48px; color: var(--accent-glow); margin-bottom: 20px;"></i>
        <h1 class="login-title">Check Your Email</h1>
        <p class="login-subtitle">Password reset instructions have been sent to your email.</p>
        <a href="{% url 'accounts:login' %}" class="btn-primary-custom" style="margin-top: 20px;">Back to Login</a>
    </div>
</div>
{% endblock %}
