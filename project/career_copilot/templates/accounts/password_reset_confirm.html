{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block body %}
<div class="login-container">
    <div class="login-card animate-scale-in">
        <h1 class="login-title text-center gradient-text">Set New Password</h1>
        <p class="login-subtitle text-center">Enter your new password below</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password1" class="form-input input-glow" required>
            </div>
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="new_password2" class="form-input input-glow" required>
            </div>
            {% if form.errors %}
                <div class="alert-custom alert-error-custom">{{ form.errors|join:', ' }}</div>
            {% endif %}
            <button type="submit" class="btn-primary-custom btn-shine w-100" style="padding: 14px;">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
