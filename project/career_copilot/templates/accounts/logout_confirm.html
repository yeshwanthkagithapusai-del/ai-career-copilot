{% extends 'base.html' %}
{% load static %}
{% block title %}Logout{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block body %}
<div class="login-container">
    <div class="login-card animate-scale-in text-center">
        <i class="fas fa-sign-out-alt" style="font-size: 48px; color: var(--accent-glow); margin-bottom: 20px;"></i>
        <h1 class="login-title">Log Out?</h1>
        <p class="login-subtitle">Are you sure you want to log out?</p>
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn-primary-custom btn-shine" style="padding: 14px 36px; margin-top: 10px;">
                <i class="fas fa-sign-out-alt"></i> Yes, Log Out
            </button>
        </form>
        <a href="{% url 'dashboard:dashboard' %}" class="btn-secondary-custom" style="margin-top: 12px;">Cancel</a>
    </div>
</div>
{% endblock %}
