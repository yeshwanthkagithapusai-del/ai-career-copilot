{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block body %}
<div class="login-container">
    <div class="login-card animate-scale-in text-center">
        <i class="fas fa-check-circle" style="font-size: 48px; color: var(--success); margin-bottom: 20px;"></i>
        <h1 class="login-title">Password Reset!</h1>
        <p class="login-subtitle">Your password has been successfully reset.</p>
        <a href="{% url 'accounts:login' %}" class="btn-primary-custom" style="margin-top: 20px;">Sign In</a>
    </div>
</div>
{% endblock %}
